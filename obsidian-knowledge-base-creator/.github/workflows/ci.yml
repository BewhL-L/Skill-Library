# GitHub Actions CI/CD 配置
# 自动运行代码检查和测试，确保代码质量

name: CI/CD

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 代码质量检查
  lint:
    name: 代码质量检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy

      - name: 运行项目代码质量检查
        run: python scripts/lint.py --path scripts

      - name: 运行 flake8
        run: |
          flake8 scripts/ kb.py scripts/lint.py tests/test-all.py \
            --max-line-length=120 \
            --extend-ignore=E203,W503,E501

      - name: 检查代码格式 (black)
        run: |
          black --check --line-length 120 scripts/ kb.py scripts/lint.py tests/test-all.py

      - name: 检查导入排序 (isort)
        run: |
          isort --check-only --profile black --line-length 120 scripts/ kb.py

  # 类型检查
  type-check:
    name: 类型检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install mypy types-PyYAML

      - name: 运行 mypy 类型检查
        run: |
          mypy scripts/ kb.py \
            --ignore-missing-imports \
            --disable-error-code=attr-defined \
            --disable-error-code=name-defined \
            --no-strict-optional

  # 自动化测试
  test:
    name: 自动化测试
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 运行自动化测试
        run: python tests/test-all.py

  # 跨平台测试
  cross-platform:
    name: 跨平台测试
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 运行自动化测试
        run: python tests/test-all.py

  # Markdown 检查
  markdown-lint:
    name: Markdown 检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 运行 markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v15
        with:
          globs: '**/*.md'
          config: '.markdownlint.json'

  # Shell 脚本检查
  shell-lint:
    name: Shell 脚本检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 运行 shellcheck
        run: |
          shellcheck install.sh uninstall.sh || true

  # 安全检查
  security:
    name: 安全检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装安全检查工具
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: 运行 bandit 安全检查
        run: |
          bandit -r scripts/ kb.py -ll || true

      - name: 检查依赖安全
        run: |
          safety check || true
