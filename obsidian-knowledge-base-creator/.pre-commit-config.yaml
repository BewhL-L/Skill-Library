# Pre-commit 配置文件
# 安装: pip install pre-commit && pre-commit install
# 手动运行: pre-commit run --all-files

repos:
  # 通用钩子
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace        # 去除行尾空格
      - id: end-of-file-fixer          # 确保文件末尾有换行
      - id: check-yaml                 # 检查 YAML 语法
      - id: check-json                 # 检查 JSON 语法
      - id: check-merge-conflict       # 检查合并冲突标记
      - id: check-case-conflict        # 检查文件名大小写冲突
      - id: check-added-large-files    # 检查大文件
        args: ['--maxkb=500']
      - id: mixed-line-ending          # 统一换行符
        args: ['--fix=lf']
      - id: name-tests-test            # 测试文件命名规范
      - id: no-commit-to-branch       # 禁止直接提交到主分支
        args: ['--branch', 'main', '--branch', 'master']

  # Python 代码格式化
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3
        args: ['--line-length=120']

  # Python 导入排序
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ['--profile', 'black', '--line-length=120']

  # Python 代码检查
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args:
          - '--max-line-length=120'
          - '--extend-ignore=E203,W503,E501'
        additional_dependencies:
          - flake8-docstrings
          - flake8-import-order

  # Python 类型检查
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        args: ['--ignore-missing-imports', '--disable-error-code=attr-defined']
        additional_dependencies:
          - types-PyYAML

  # Markdown 检查
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint
        args: ['--disable', 'MD013', 'MD033', 'MD041']

  # Shell 脚本检查
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck

  # 本地钩子：运行项目自带的代码检查
  - repo: local
    hooks:
      - id: lint-check
        name: 项目代码质量检查
        entry: python lint.py
        language: system
        types: [python]
        pass_filenames: false

      - id: test-run
        name: 自动化测试
        entry: python test-all.py
        language: system
        types: [python]
        pass_filenames: false
        stages: [push]  # 只在 push 时运行，避免每次提交都慢
